<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Glassmorphism UI - Pink & Purple Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0c0714;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(236, 72, 153, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(219, 39, 119, 0.12) 0%, transparent 65%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(20, 11, 33, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(236, 72, 153, 0.35);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.6),
                0 0 20px rgba(219, 39, 119, 0.2),
                inset 0 0 15px rgba(168, 85, 247, 0.12);
            border-radius: 32px;
        }

        .glass-panel-glow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(236, 72, 153, 0.25),
                0 0 60px rgba(168, 85, 247, 0.15);
        }

        .neon-pink-text {
            color: #ec4899;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.7);
        }

        .neon-purple-text {
            color: #c084fc;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.7);
        }

        .pink-gradient-btn {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }

        .pink-gradient-btn:hover {
            box-shadow: 0 0 22px rgba(236, 72, 153, 0.9);
            transform: scale(1.06);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            height: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px #ec4899, 0 0 6px #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.35);
        }

        .album-stack-back {
            transform: scale(0.82) translateY(-18px) rotate(-6deg);
            opacity: 0.45;
        }

        .album-stack-mid {
            transform: scale(0.91) translateY(-9px) rotate(4deg);
            opacity: 0.75;
        }

        .album-stack-front {
            transform: scale(1) translateY(0);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 20px rgba(236, 72, 153, 0.35);
        }

        .active-pill {
            position: absolute;
            left: -1px;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #ec4899, #a855f7);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 12px #ec4899;
        }
    </style>
</head>

<body class="p-4 sm:p-8 text-gray-200">

    <div class="flex flex-col md:flex-row gap-6 items-center justify-center max-w-5xl w-full my-auto">

        <div
            class="glass-panel w-20 py-6 flex flex-col items-center justify-between h-[680px] relative transition-all duration-300 hover:border-pink-500/60">

            <!-- Window Control Dots -->
            <div class="flex gap-1.5 mb-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500/80 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/80 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-green-500/80 inline-block"></span>
            </div>

            <div class="my-4 cursor-pointer hover:scale-110 transition-transform">
                <i class="fa-brands fa-spotify text-3xl neon-pink-text"></i>
            </div>

            <div class="flex flex-col items-center gap-7 w-full my-auto relative">
                <div class="relative w-full flex items-center justify-center py-1">
                    <div class="active-pill"></div>
                    <button class="text-white hover:text-pink-400 transition-colors">
                        <i class="fa-solid fa-house text-lg"></i>
                    </button>
                </div>

                <button class="text-gray-400 hover:text-pink-400 transition-colors">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>

                <button class="text-gray-400 hover:text-pink-400 transition-colors">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </button>

                <button class="text-gray-400 hover:text-pink-400 transition-colors">
                    <i class="fa-solid fa-certificate text-lg"></i>
                </button>

                <button class="text-gray-400 hover:text-pink-400 transition-colors relative">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span
                        class="absolute -top-1 -right-1 w-2 h-2 bg-pink-500 rounded-full shadow-[0_0_8px_#ec4899]"></span>
                </button>

                <button class="text-gray-400 hover:text-pink-400 transition-colors">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>

            <div class="flex flex-col items-center gap-6 mt-auto">
                <button
                    class="w-10 h-10 rounded-full pink-gradient-btn flex items-center justify-center text-white transition-all">
                    <i class="fa-solid fa-play text-xs ml-0.5"></i>
                </button>

                <button class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-sliders text-sm"></i>
                </button>

                <div
                    class="w-9 h-9 rounded-full p-[2px] bg-gradient-to-r from-pink-500 to-purple-500 cursor-pointer hover:scale-105 transition-transform">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
                        alt="User Profile" class="w-full h-full object-cover rounded-full">
                </div>
            </div>

        </div>


        <div
            class="glass-panel glass-panel-glow w-full max-w-md p-6 flex flex-col justify-between h-[680px] relative overflow-hidden transition-all duration-300">

            <div>
                <div class="flex items-center justify-between mb-4">
                    <div class="flex gap-1.5">
                        <span
                            class="w-2.5 h-2.5 rounded-full bg-red-500/80 inline-block cursor-pointer hover:opacity-100 opacity-80"></span>
                        <span
                            class="w-2.5 h-2.5 rounded-full bg-yellow-500/80 inline-block cursor-pointer hover:opacity-100 opacity-80"></span>
                        <span
                            class="w-2.5 h-2.5 rounded-full bg-green-500/80 inline-block cursor-pointer hover:opacity-100 opacity-80"></span>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-5">
                    <span class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        Spotify <i class="fa-brands fa-spotify text-2xl neon-pink-text"></i>
                    </span>
                </div>

                <div class="border-t border-pink-500/15 mb-4"></div>

                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">MENU</p>

                <nav class="space-y-1">
                    <div
                        class="relative flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-purple-900/25 text-white font-medium cursor-pointer transition-all border border-pink-500/25">
                        <div class="active-pill"></div>
                        <div class="flex items-center gap-3.5">
                            <i class="fa-solid fa-house text-pink-400 text-base"></i>
                            <span class="text-sm">Home</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-pink-400"></i>
                    </div>

                    <a href="#"
                        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                        <div class="flex items-center gap-3.5">
                            <i class="fa-solid fa-magnifying-glass text-base"></i>
                            <span class="text-sm">Search</span>
                        </div>
                    </a>

                    <a href="#"
                        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                        <div class="flex items-center gap-3.5">
                            <i class="fa-solid fa-book-open text-base"></i>
                            <span class="text-sm">Your library</span>
                        </div>
                    </a>

                    <a href="#"
                        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                        <div class="flex items-center gap-3.5">
                            <i class="fa-solid fa-certificate text-base"></i>
                            <span class="text-sm">Premium</span>
                        </div>
                    </a>

                    <a href="#"
                        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                        <div class="flex items-center gap-3.5">
                            <i class="fa-regular fa-bell text-base"></i>
                            <span class="text-sm">Notification</span>
                        </div>
                        <span class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></span>
                    </a>

                    <a href="#"
                        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition-all">
                        <div class="flex items-center gap-3.5">
                            <i class="fa-solid fa-gear text-base"></i>
                            <span class="text-sm">Settings</span>
                        </div>
                    </a>
                </nav>
            </div>

            <div class="my-auto pt-2 flex flex-col items-center">
                <div class="relative w-28 h-28 mb-3 flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80"
                        alt="Background Album Art 2"
                        class="absolute w-24 h-24 rounded-2xl object-cover album-stack-back transition-all duration-300">

                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80"
                        alt="Background Album Art 1"
                        class="absolute w-24 h-24 rounded-2xl object-cover album-stack-mid transition-all duration-300">

                    <div
                        class="absolute w-24 h-24 rounded-2xl overflow-hidden album-stack-front border border-pink-500/40">
                        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80"
                            alt="Eminem Album" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent">
                        </div>
                    </div>
                </div>

                <div class="text-center mb-3">
                    <h3 class="text-xs font-bold text-gray-100 tracking-wide uppercase inline-block mr-1">Eminem</h3>
                    <span class="text-xs text-gray-400 font-medium">Without me</span>
                </div>

                <div class="w-full px-4 mb-4">
                    <input type="range" id="trackProgress" min="0" max="100" value="45" class="w-full cursor-pointer">
                </div>

                <div class="flex items-center justify-center gap-6">
                    <button class="text-gray-400 hover:text-pink-400 transition-colors text-lg active:scale-90">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>

                    <button id="playBtn"
                        class="w-10 h-10 rounded-full bg-white text-purple-950 flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.7)] hover:scale-105 active:scale-95 transition-transform">
                        <i class="fa-solid fa-play ml-0.5 text-sm" id="playIcon"></i>
                    </button>

                    <button class="text-gray-400 hover:text-pink-400 transition-colors text-lg active:scale-90">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
            </div>

            <div>
                <div class="border-t border-pink-500/15 mb-3"></div>
                <div class="flex items-center justify-between px-1 py-1">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 rounded-full p-[2px] bg-gradient-to-r from-pink-500 to-purple-500 cursor-pointer">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
                                alt="User Hesala hertz" class="w-full h-full object-cover rounded-full">
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 cursor-pointer group">
                                <h4
                                    class="text-xs font-bold text-white tracking-wide group-hover:text-pink-300 transition-colors">
                                    Hesala hertz</h4>
                                <i
                                    class="fa-solid fa-chevron-down text-[10px] text-gray-400 group-hover:text-white transition-colors"></i>
                            </div>
                            <p class="text-[10px] text-gray-400 font-medium">Premium Account</p>
                        </div>
                    </div>

                    <button class="text-gray-400 hover:text-pink-400 transition-colors p-2">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.classList.remove('fa-play', 'ml-0.5');
                playIcon.classList.add('fa-pause');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-0.5');
            }
        });
    </script>
</body>

</html>
